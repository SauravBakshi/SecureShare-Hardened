# Externalize all secrets. See SECURITY.md before starting the application.
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/secure_file_sharing?sslMode=VERIFY_IDENTITY&allowPublicKeyRetrieval=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:sfsuser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}
logging.level.com.securefilesharing=INFO
logging.level.org.springframework.security=INFO
