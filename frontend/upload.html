<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureShare - Upload</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="with-sidebar">
    <div id="sidebar-container"></div>
    
    <div class="main-content" style="flex:1;">
      <div class="page-header">
        <h1>Secure File Upload</h1>
      </div>

      <div class="card" style="max-width: 600px;">
        <div id="dropzone" class="upload-dropzone">
          <div style="font-size: 3rem; margin-bottom: 1rem;">📁</div>
          <h3>Drag & Drop your file here</h3>
          <p style="color: var(--text-muted); margin: 0.5rem 0 1.5rem;">or</p>
          <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">Browse Files</button>
          <input type="file" id="file-input" style="display:none;">
        </div>

        <div id="file-preview" style="display:none; margin-top: 1.5rem; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 8px;">
          <h4 style="margin-bottom: 0.5rem;">Selected File</h4>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div id="preview-name" style="font-weight:600; color:var(--accent-cyan);"></div>
              <div id="preview-size" style="color:var(--text-muted); font-size:0.875rem;"></div>
            </div>
            <button class="btn btn-outline" id="cancel-btn">Cancel</button>
          </div>
          
          <div id="progress-container" class="progress-container" style="display:none;">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
          <div id="upload-status" style="margin-top: 0.5rem; font-size: 0.875rem; text-align: center;"></div>
          
          <button id="upload-btn" class="btn btn-primary" style="width:100%; margin-top: 1.5rem;">Upload & Encrypt File</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/upload.js"></script>
</body>
</html>
