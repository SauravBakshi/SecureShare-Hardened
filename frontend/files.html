<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureShare - My Files</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="with-sidebar">
    <div id="sidebar-container"></div>
    
    <div class="main-content" style="flex:1;">
      <div class="page-header" style="display:flex; justify-content:space-between; align-items:center;">
        <h1>My Files</h1>
        <button id="refresh-btn" class="btn btn-outline">Refresh</button>
      </div>

      <div class="card">
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>File Name</th>
                <th>Size</th>
                <th>Uploaded</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="files-table-body">
              <tr><td colspan="5" style="text-align:center;"><span class="spinner"></span></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="modal-overlay" id="share-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Share File</h3>
        <button class="modal-close" onclick="closeShareModal()">&times;</button>
      </div>
      <form id="share-form">
        <input type="hidden" id="share-file-id">
        <div class="form-group">
          <label>File</label>
          <input type="text" id="share-file-name" readonly disabled>
        </div>
        <div class="form-group">
          <label>Select User</label>
          <select id="share-user-select" required>
            <option value="">Loading users...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Permission</label>
          <select id="share-permission" required>
            <option value="READ">Read Only</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Share File</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/files.js"></script>
</body>
</html>
