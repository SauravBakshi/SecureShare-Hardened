<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureShare - Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="with-sidebar">
    <div id="sidebar-container"></div>
    
    <div class="main-content" style="flex:1;">
      <div class="page-header">
        <h1>User Profile</h1>
      </div>

      <div class="grid-2">
        <div class="card" style="text-align:center;">
          <div id="profile-avatar" style="width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); display: flex; justify-content: center; align-items: center; font-size: 2.5rem; font-weight: bold; margin: 0 auto 1.5rem; color: #fff;"></div>
          <h2 id="profile-username" style="margin-bottom:0.5rem;"></h2>
          <p id="profile-email" style="color:var(--text-muted); margin-bottom: 1rem;"></p>
          <div style="margin-bottom: 1.5rem;"><span id="profile-role" class="badge"></span></div>
          
          <div style="display:flex; justify-content: space-around; border-top: 1px solid var(--border-light); padding-top: 1.5rem;">
            <div>
              <div style="font-size:1.5rem; font-weight:bold; color:var(--accent-cyan);" id="stat-uploads">-</div>
              <div style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase;">Uploads</div>
            </div>
            <div>
              <div style="font-size:1.5rem; font-weight:bold; color:var(--accent-purple);" id="stat-shares">-</div>
              <div style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase;">Shared With You</div>
            </div>
          </div>
        </div>
        
        <div class="card">
          <h3>Security Information</h3>
          <p style="color:var(--text-muted); margin-bottom:1.5rem;">Your account's security settings and encryption details.</p>
          
          <div style="display:flex; flex-direction:column; gap:1rem;">
            <div style="padding:1rem; background:rgba(0,0,0,0.2); border-radius:8px; border: 1px solid var(--border-light);">
              <strong style="color:var(--text-main); display:block; margin-bottom:0.25rem;">Encryption Standard</strong>
              <span style="color:var(--text-muted); font-size:0.875rem;">AES-256-GCM (Phase 2 feature)</span>
            </div>
            <div style="padding:1rem; background:rgba(0,0,0,0.2); border-radius:8px; border: 1px solid var(--border-light);">
              <strong style="color:var(--text-main); display:block; margin-bottom:0.25rem;">Key Management</strong>
              <span style="color:var(--text-muted); font-size:0.875rem;">RSA Asymmetric Keys (Phase 2 feature)</span>
            </div>
            <div style="padding:1rem; background:rgba(0,0,0,0.2); border-radius:8px; border: 1px solid var(--border-light);">
              <strong style="color:var(--text-main); display:block; margin-bottom:0.25rem;">Two-Factor Authentication</strong>
              <span class="badge badge-warning">Not Configured</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
